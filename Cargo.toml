[package]
name = "melody-magnet"
version = "1.2.0"
edition = "2024"

[dependencies]
thiserror = "2.0"
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.10"
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
metaflac = "0.2"
dotenvy = "0.15"
dotenv_config = "0.2"

rusqlite = { version = "0.34.0", features = ["bundled", "chrono"] }

tiny_http = "0.12"
once_cell = "1.19"
url = "2.5"