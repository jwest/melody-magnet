services:
  melody-magnet:
    image: jwestfalewski/melody-magnet:1.3.5
    user: 1001:1001
    ports:
      - '8080:8080'
    restart: unless-stopped
    environment:
      LIBRARY_PATH: '/library'
      SESSION_STORE_PATH: '/data'
      DATABASE_FILE_PATH: '/data/library.db'
      SYNC_INTERVAL_SECONDS: '300'
      HTTP_ENABLED: True
      HTTP_HOST: 0.0.0.0
      HTTP_PORT: 8080
    volumes:
      - './library:/library:rw'
      - './data:/data:rw'