services:
  melody-magnet:
    image: jwestfalewski/melody-magnet:1.2.0
    user: 1001:1001
    environment:
      LIBRARY_PATH: '/library'
      SESSION_STORE_PATH: '/data'
      DATABASE_FILE_PATH: '/data/library.db'
      TIME_ZONE: 'Europe/Warsaw'
      CRON_TAB_DEFINITION: '* */5 * * * *'
    volumes:
      - './library:/library:rw'
      - './data:/data:rw'